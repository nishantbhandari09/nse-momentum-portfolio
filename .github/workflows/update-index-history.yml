name: Update FYERS Historical Price Database

on:
  workflow_dispatch:
  schedule:
    # Run after NSE's cash-market close on weekdays (16:45 IST).
    - cron: "15 11 * * 1-5"
  push:
    paths:
      - ".github/workflows/update-index-history.yml"
      - "scripts/update_fyers_history.py"
      - "fyers_history_data.py"
      - "index_history_data.py"
      - "etf_group_universe.py"

permissions:
  contents: write

concurrency:
  group: fyers-historical-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install updater dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download or incrementally update FYERS historical OHLCV
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          FYERS_REFRESH_TOKEN: ${{ secrets.FYERS_REFRESH_TOKEN }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_HISTORY_START_DATE: ${{ vars.FYERS_HISTORY_START_DATE || '1990-01-01' }}
          FYERS_MAX_REQUESTS_PER_RUN: ${{ vars.FYERS_MAX_REQUESTS_PER_RUN || '4500' }}
          FYERS_REQUEST_DELAY_SECONDS: ${{ vars.FYERS_REQUEST_DELAY_SECONDS || '1.25' }}
        run: |
          if [ -z "$FYERS_APP_ID" ]; then
            echo "::notice::Historical refresh skipped. Add FYERS_APP_ID and FYERS credentials under Settings > Secrets and variables > Actions."
            exit 0
          fi
          if [ -z "$FYERS_ACCESS_TOKEN" ] && { [ -z "$FYERS_REFRESH_TOKEN" ] || [ -z "$FYERS_SECRET_ID" ] || [ -z "$FYERS_PIN" ]; }; then
            echo "::notice::Historical refresh skipped. Configure either FYERS_ACCESS_TOKEN, or FYERS_SECRET_ID + FYERS_REFRESH_TOKEN + FYERS_PIN."
            exit 0
          fi
          python scripts/update_fyers_history.py

      - name: Commit updated FYERS history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/fyers_history data/index_prices data/fyers_history_manifest.csv data/fyers_history_failures.csv
          if git diff --cached --quiet; then
            echo "No FYERS history changed; no commit needed."
          else
            git commit -m "Update stored FYERS historical OHLCV"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
