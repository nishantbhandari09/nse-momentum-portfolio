name: Update Historical Nifty Index Data

on:
  workflow_dispatch:
  schedule:
    # 16:45 India Standard Time on weekdays, after the cash-market close.
    - cron: "15 11 * * 1-5"
  push:
    paths:
      - ".github/workflows/update-index-history.yml"
      - "scripts/update_index_history.py"
      - "index_history_data.py"

permissions:
  contents: write

concurrency:
  group: historical-index-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data refresh dependencies
        run: python -m pip install --upgrade pip pandas requests jugaad-data
      - name: Backfill and refresh historical index datasets
        run: python scripts/update_index_history.py
      - name: Commit updated local history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_prices data/index_membership_history.csv
          if git diff --cached --quiet; then
            echo "No history changed; no commit needed."
          else
            git commit -m "Update stored historical Nifty index data"
            git push
          fi
