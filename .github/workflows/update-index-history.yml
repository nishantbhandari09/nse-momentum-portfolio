name: Update FYERS Historical Price Database

on:
  # A connected FYERS login updates the fresh token secret and triggers this event.
  repository_dispatch:
    types: [fyers-login]
  # Manual retries are available after logging into FYERS from the app.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fyers-historical-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install updater dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download or incrementally update FYERS historical OHLCV
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          FYERS_HISTORY_START_DATE: ${{ vars.FYERS_HISTORY_START_DATE || '' }}
          FYERS_MAX_REQUESTS_PER_RUN: ${{ vars.FYERS_MAX_REQUESTS_PER_RUN || '4500' }}
          FYERS_REQUEST_DELAY_SECONDS: ${{ vars.FYERS_REQUEST_DELAY_SECONDS || '1.25' }}
        run: |
          if [ -z "$FYERS_APP_ID" ]; then
            echo "::error::FYERS history was NOT downloaded. Complete a fresh FYERS login from the app so it can safely sync FYERS_APP_ID."
            exit 1
          fi
          if [ -z "$FYERS_ACCESS_TOKEN" ]; then
            echo "::error::FYERS history was NOT downloaded. Complete a fresh FYERS login from the app to refresh the access-token secret."
            exit 1
          fi
          python scripts/update_fyers_history.py

      - name: Commit any saved FYERS history progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then
            echo "No FYERS history changed; no commit needed."
          else
            git commit -m "Update stored FYERS historical OHLCV"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
