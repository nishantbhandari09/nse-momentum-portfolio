name: Update all-stock NSE historical archive

on:
  # Run after the NSE cash-market close on weekdays.
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Earliest date to backfill (YYYY-MM-DD)"
        required: false
        default: "1994-11-03"
      end_date:
        description: "End date (YYYY-MM-DD); blank means yesterday"
        required: false
        default: ""
  # The first deployment of the compact builder launches the initial archive build.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nse-all-stock-history.yml"
      - "scripts/download_nse_history.py"
      - "scripts/build_derived.py"

permissions:
  contents: write

concurrency:
  group: nse-all-stock-history
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The raw bhavcopy cache lets subsequent runs resume; Release assets are
      # permanent and are consumed by the Streamlit app on demand.
      - name: Restore NSE history cache
        uses: actions/cache@v4
        with:
          path: nse_data
          key: nse-bhavcopy-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ github.ref_name }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests

      - name: Download and merge NSE bhavcopy history
        env:
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          START_DATE="${INPUT_START_DATE:-1994-11-03}"
          if [ -n "${INPUT_END_DATE}" ]; then
            python scripts/download_nse_history.py --start-date "$START_DATE" --end-date "$INPUT_END_DATE"
          else
            python scripts/download_nse_history.py --start-date "$START_DATE"
          fi

      - name: Save previous release manifest for change detection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nse-previous
          if gh release view nse-data >/dev/null 2>&1; then
            gh release download nse-data --pattern manifest.json --dir /tmp/nse-previous --clobber || true
          fi

      - name: Build compact, adjusted per-year price files
        run: python scripts/build_derived.py

      - name: Publish changed data assets to permanent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nse-data >/dev/null 2>&1; then
            gh release create nse-data --title "NSE historical data archive" --notes "Auto-updated compact daily split/bonus-adjusted price history from NSE bhavcopy archives. Adjustment does not include cash dividends."
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          old_path = Path("/tmp/nse-previous/manifest.json")
          new_path = Path("nse_data/derived/manifest.json")
          old = json.loads(old_path.read_text()) if old_path.exists() else {}
          new = json.loads(new_path.read_text())
          old_years = old.get("years", {})
          changed = []
          for year, item in sorted(new.get("years", {}).items()):
              if old_years.get(year, {}).get("sha256") != item.get("sha256"):
                  changed.append(item["asset"])
          if old.get("symbols_sha256") != new.get("symbols_sha256"):
              changed.append(new.get("symbols_asset", "symbols.parquet"))
          Path("/tmp/nse-release-assets.txt").write_text("\n".join(changed) + ("\n" if changed else ""))
          print(f"Changed yearly/symbol assets to publish: {len(changed)}")
          for asset in changed:
              print(f" - {asset}")
          PY

          mapfile -t CHANGED_ASSETS < /tmp/nse-release-assets.txt
          ASSET_PATHS=()
          for asset in "${CHANGED_ASSETS[@]}"; do
            [ -n "$asset" ] && ASSET_PATHS+=("nse_data/derived/$asset")
          done
          # The manifest is small and is refreshed every run; it advertises the
          # available years, hashes, date coverage and last successful build.
          ASSET_PATHS+=("nse_data/derived/manifest.json")
          gh release upload nse-data "${ASSET_PATHS[@]}" --clobber

      - name: Publish downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-all-stock-history-${{ github.run_number }}
          path: |
            nse_data/yearly/*.parquet
            nse_data/derived/*.parquet
            nse_data/derived/manifest.json
            nse_data/download_failures.csv
          if-no-files-found: error
          retention-days: 30
