name: Validate Python App

on:
  push:
    paths:
      - "app.py"
      - "*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pandas requests PyNaCl pyarrow xlrd

      - name: Compile application and supporting modules
        run: |
          python -m py_compile app.py fyers_auth.py fyers_history_data.py nse_history_data.py nse_archive_data.py momentum_data.py index_history_data.py index_constituents.py etf_index_universe.py etf_group_universe.py
          python -m py_compile scripts/update_fyers_history.py scripts/update_index_history.py scripts/download_nse_history.py scripts/build_derived.py
          python -c "from nacl.public import PublicKey, SealedBox; import fyers_history_data, nse_history_data, nse_archive_data, index_history_data; import scripts.update_fyers_history as updater; assert len(updater.INDEX_FILE_BY_TICKER) == 9; print('FYERS/NSE history readers, release-backed archive loader and index mappings imported successfully')"
          python -m unittest discover -s tests -v
