name: Validate Python App

on:
  push:
    paths:
      - "app.py"
      - "*.py"
      - "scripts/**/*.py"
      - ".github/workflows/validate-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile application and supporting modules
        run: |
          python -m py_compile app.py fyers_auth.py momentum_data.py index_history_data.py index_constituents.py etf_index_universe.py etf_group_universe.py
          python -m py_compile scripts/update_index_history.py
